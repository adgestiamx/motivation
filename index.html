.tarjeta:before,.tarjeta:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.tarjeta:before{width:220px;height:220px;background:#F8DDE2;top:-120px;left:-90px;opacity:.7}
.tarjeta:after{width:190px;height:190px;background:#EFD5C7;bottom:-110px;right:-80px;opacity:.55}
.moño,.titulo,.frase,.autora,.descripcion,.adgestia,.tagline,.nota{position:relative;z-index:1}

.titulo{color:#884D3A;font:700 25px Arial,sans-serif;letter-spacing:1px;margin-bottom:24px}
.frase{max-width:620px;margin:0 auto 25px;color:#4A3428;font-size:clamp(21px,3.4vw,28px);line-height:1.48}
.autora{color:#884D3A;font:700 12px Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.descripcion{margin:8px auto 0;max-width:540px;color:#8A7064;font:12px/1.5 Arial,sans-serif}
.nota{margin-top:12px;color:#9A8175;font:10px Arial,sans-serif}
.adgestia{margin-top:30px;color:#4A3428;font:700 13px Arial,sans-serif;letter-spacing:3.5px}
.tagline{margin-top:6px;color:#B8895A;font:10px Arial,sans-serif;letter-spacing:.5px}
@media(max-width:600px){body{padding:12px}.tarjeta{border-radius:24px}.titulo{font-size:22px}.autora{font-size:11px}}
