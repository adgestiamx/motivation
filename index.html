<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mensaje del día · Adgestia</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(248, 221, 226, 0.65),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(239, 213, 199, 0.55),
          transparent 30%
        ),
        #FDF6F2;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }


    /* =========================================
       CONTENEDOR PRINCIPAL
       ========================================= */

    .contenedor {
      width: 100%;
      max-width: 760px;
    }


    /* =========================================
       TARJETA
       ========================================= */

    .tarjeta {
      position: relative;

      width: 100%;

      background: #FFF9F6;

      border: 1px solid #D8A7A7;

      border-radius: 30px;

      padding:
        58px
        55px
        48px;

      text-align: center;

      overflow: hidden;

      box-shadow:
        0 20px 55px rgba(74, 52, 40, 0.12);

      transition:
        opacity 0.4s ease,
        transform 0.4s ease;
    }


    /* =========================================
       DECORACIONES
       ========================================= */

    .tarjeta::before {
      content: "";

      position: absolute;

      width: 220px;
      height: 220px;

      background: #F8DDE2;

      border-radius: 50%;

      top: -120px;
      left: -90px;

      opacity: 0.7;
    }


    .tarjeta::after {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      background: #EFD5C7;

      border-radius: 50%;

      bottom: -110px;
      right: -80px;

      opacity: 0.55;
    }


    /* =========================================
       MOÑO
       ========================================= */

    .moño {
      position: relative;

      z-index: 2;

      font-size: 46px;

      line-height: 1;

      margin-bottom: 16px;

      animation:
        aparecer 0.7s ease;
    }


    /* =========================================
       BUENOS DÍAS
       ========================================= */

    .titulo {
      position: relative;

      z-index: 2;

      color: #884D3A;

      font-size: 27px;

      font-weight: bold;

      letter-spacing: 1px;

      margin-bottom: 30px;

      animation:
        aparecer 0.7s ease 0.05s both;
    }


    /* =========================================
       FRASE
       ========================================= */

    .frase {
      position: relative;

      z-index: 2;

      max-width: 620px;

      margin:
        0 auto
        28px;

      color: #4A3428;

      font-size: 27px;

      line-height: 1.52;

      font-weight: normal;

      animation:
        aparecer 0.7s ease 0.1s both;
    }


    /* =========================================
       AUTORA
       ========================================= */

    .autora {
      position: relative;

      z-index: 2;

      color: #884D3A;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      font-weight: bold;

      letter-spacing: 1.8px;

      text-transform: uppercase;

      animation:
        aparecer 0.7s ease 0.15s both;
    }


    /* =========================================
       DESCRIPCIÓN
       ========================================= */

    .descripcion {
      position: relative;

      z-index: 2;

      margin-top: 8px;

      color: #8A7064;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 12px;

      letter-spacing: 0.2px;

      animation:
        aparecer 0.7s ease 0.2s both;
    }


    /* =========================================
       ADGESTIA
       ========================================= */

    .adgestia {
      position: relative;

      z-index: 2;

      margin-top: 38px;

      color: #4A3428;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      font-weight: bold;

      letter-spacing: 3.5px;

      animation:
        aparecer 0.7s ease 0.25s both;
    }


    /* =========================================
       TAGLINE
       ========================================= */

    .tagline {
      position: relative;

      z-index: 2;

      margin-top: 6px;

      color: #B8895A;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 10px;

      letter-spacing: 0.5px;

      animation:
        aparecer 0.7s ease 0.3s both;
    }


    /* =========================================
       ANIMACIÓN
       ========================================= */

    @keyframes aparecer {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* =========================================
       RESPONSIVE
       ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .tarjeta {
        padding:
          48px
          27px
          40px;

        border-radius: 25px;
      }

      .moño {
        font-size: 40px;
      }

      .titulo {
        font-size: 23px;

        margin-bottom: 25px;
      }

      .frase {
        font-size: 21px;

        line-height: 1.5;
      }

      .autora {
        font-size: 11px;

        letter-spacing: 1.4px;
      }

      .descripcion {
        font-size: 11px;
      }

      .adgestia {
        margin-top: 32px;

        font-size: 12px;

        letter-spacing: 3px;
      }

    }


  </style>
</head>


<body>


  <!-- =========================================

    <div

    /*
    =====================================================
    OBTENER FECHA ACTUAL DE CIUDAD DE MÉXICO
    =====================================================
    */

    function obtenerFechaMexico() {

      return new Intl.DateTimeFormat(
        "en-CA",
        {
          timeZone: "America/Mexico_City",

          year: "numeric",

          month: "2-digit",

          day: "2-digit"
        }
      ).format(new Date());

    }


    /*
    =====================================================
    MOSTRAR MENSAJE CORRESPONDIENTE AL DÍA
    =====================================================
    */

    function mostrarMensajeDelDia() {

      const fechaHoy =
        obtenerFechaMexico();


      const mensaje =
        mensajes.find(
          item =>
            item.fecha === fechaHoy
        );


      const tarjeta =
        document.getElementById("mensaje");


      /*
      ---------------------------------------------
      FUERA DEL PERIODO
      ---------------------------------------------
      */

      if (!mensaje) {

        tarjeta.innerHTML = `

          <div class="moño">
            🎀
          </div>

          <div class="titulo">
            Buenos días
          </div>

          <div class="frase">
            Pronto habrá un nuevo mensaje para ti.
          </div>

          <div class="adgestia">
            ADGESTIA
          </div>

          <div class="tagline">
            Administración y Gestión con IA
          </div>

        `;

        return;
      }


      /*
      ---------------------------------------------
      MENSAJE DEL DÍA
      ---------------------------------------------
      */

      tarjeta.innerHTML = `

        <div class="moño">
          🎀
        </div>

        <div class="titulo">
          Buenos días
        </div>

        <div class="frase">
          “${mensaje.frase}”
        </div>

        <div class="autora">
          ${mensaje.autora}
        </div>

        <div class="descripcion">
          ${mensaje.descripcion}
        </div>

        <div class="adgestia">
          ADGESTIA
        </div>

        <div class="tagline">
          Administración y Gestión con IA
        </div>

      `;

    }


    /*
    =====================================================
    CARGAR AL ABRIR
    =====================================================
    */

    mostrarMensajeDelDia();


    /*
    =====================================================
    COMPROBAR CAMBIO DE DÍA
    =====================================================

    Se revisa cada minuto.

    Esto significa que:

    07/10 00:00 → mensaje del 7
    07/10 23:59 → mensaje del 7
    08/10 00:00 → mensaje del 8

    El usuario no tiene que actualizar manualmente
    el contenido.
    */

    setInterval(
      mostrarMensajeDelDia,
      60000
    );


  </script>


</body>
</html>
